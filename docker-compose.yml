# WA Box: WhatsApp group scheduler
# Two services:
#   engine - our WhatsApp engine (engine/): one whatsapp-web.js session in headless Chrome.
#            PRIVATE: no domain, no published ports, reachable only by wabox, API-key protected.
#   wabox  - scheduler + team web app (app/). The ONLY public service
#            (give it your domain in Coolify, e.g. https://wabox.example.com/wabox).
#
# Secrets are generated by Coolify (SERVICE_PASSWORD_* magic variables); nothing secret lives in git.

services:
  engine:
    build:
      context: ./engine
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      - ENGINE_API_KEY=${SERVICE_PASSWORD_64_ENGINEKEY}
      - TZ=Asia/Kolkata
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      # Restart Chrome if it grows beyond this (MB).
      - CHROME_MAX_MB=1500
      # Optional: force a specific WhatsApp Web version (e.g. 2.3000.1012345678). Empty = live,
      # with automatic fallback to the last version that worked.
      - WA_WEB_VERSION=${WA_WEB_VERSION:-}
    volumes:
      - engine-data:/data          # WhatsApp login + last good version
    tmpfs:
      - /tmp:size=512m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 1024
    mem_limit: 2g
    shm_size: 256m

  wabox:
    build:
      context: ./app
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - PORT=3000
      - BASE_PATH=/wabox
      - WA_ENGINE_URL=http://engine:3100
      - WA_ENGINE_KEY=${SERVICE_PASSWORD_64_ENGINEKEY}
      # First admin. Set ADMIN_USER (your email) in Coolify's Environment Variables. The password is
      # generated by Coolify (SERVICE_PASSWORD_ADMIN); you must change it on first login.
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      # Optional: your organisation's name, group keywords ("Cohort,Masterclass") and the app's address for alerts.
      - ORG_NAME=${ORG_NAME:-}
      - GROUP_KEYWORDS=${GROUP_KEYWORDS:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Safe defaults. Practice mode can be switched off from Safety & settings by an admin.
      - DRY_RUN=true
      - DAILY_CAP=30
      - MAX_LATE_MINUTES=120
      - TZ=Asia/Kolkata
    volumes:
      - wabox-data:/data
    depends_on:
      - engine
    expose:
      - '3000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m

volumes:
  engine-data:
  wabox-data:
