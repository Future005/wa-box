# WA Box: WhatsApp group scheduler
# Two services:
#   gateway  - Gateway gateway on the whatsapp-web.js engine (headless Chromium). PRIVATE: no domain, no ports.
#   wabox   - scheduler + team web app. The ONLY public service (Coolify domain: https://wabox.example.com/wabox)
#
# Secrets are generated by Coolify (SERVICE_PASSWORD_* magic variables), so nothing secret lives in git.

services:
  gateway:
    image: ghcr.io/example/whatsapp-gateway:${GATEWAY_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 75s
    environment:
      - NODE_ENV=production
      - PORT=2785
      - TZ=Asia/Kolkata
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      # Headless Chromium engine only. Never baileys.
      - ENGINE_TYPE=whatsapp-web.js
      # Shared secret between the two containers, generated by Coolify (64 chars).
      - API_MASTER_KEY=${SERVICE_PASSWORD_64_GATEWAYKEY}
      # Reconnect the saved WhatsApp login after restarts/redeploys (no new QR needed).
      - AUTO_START_SESSIONS=true
      - NODE_ID=wabox-gateway
      - DATABASE_TYPE=sqlite
      - ENABLE_SWAGGER=false
      - MCP_ENABLED=false
      - UPDATE_CHECK_ENABLED=false
      - LOG_LEVEL=info
    volumes:
      - gateway-data:/app/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    pids_limit: 2048
    mem_limit: 2g
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  wabox:
    build:
      context: ./app
    restart: unless-stopped
    environment:
      - PORT=3000
      - BASE_PATH=/wabox
      - GATEWAY_URL=http://gateway:2785
      - GATEWAY_API_KEY=${SERVICE_PASSWORD_64_GATEWAYKEY}
      - GATEWAY_SESSION_NAME=wabox
      # First admin. Password is generated by Coolify; see it under the app's Environment Variables
      # (SERVICE_PASSWORD_ADMIN). You must change it on first login.
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      # Safe defaults. Dry run can be switched off from the Settings tab by an admin.
      - DRY_RUN=true
      - DAILY_CAP=30
      - MAX_LATE_MINUTES=120
      - TZ=Asia/Kolkata
    volumes:
      - wabox-data:/data
    depends_on:
      - gateway
    expose:
      - '3000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m

volumes:
  gateway-data:
  wabox-data:
