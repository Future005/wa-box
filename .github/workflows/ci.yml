name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App tests (scheduler, API, webhooks, writing helpers)
        working-directory: app
        run: npm ci && npm test
      - name: Engine tests
        working-directory: engine
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci && npm test
